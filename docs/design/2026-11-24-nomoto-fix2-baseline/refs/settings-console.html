<!doctype html><html><head><title>settings-console</title><meta charset="utf-8"><style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#f5f6f8;color:#1d2129}.wrap{width:390px;margin:0 auto;min-height:700px;background:#fff}.hd{padding:18px 16px 12px;font-size:20px;font-weight:700}.card{margin:10px 14px;padding:13px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.card .t{font-weight:600}.card .s{font-size:12.5px;color:#6b7280;margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.ok{background:#22c55e}.cur{outline:2px solid #2563eb}.btn{margin:12px 14px;padding:13px;text-align:center;background:#2563eb;color:#fff;border-radius:12px;font-weight:600}.btn2{background:#fff;color:#2563eb;border:1.5px solid #2563eb}.err{margin:10px 14px;padding:11px 13px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;font-size:13.5px}.muted{padding:0 16px;color:#6b7280;font-size:13px}.nav{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid #e5e7eb}.nav div{flex:1;text-align:center;padding:9px 0;font-size:11.5px;color:#6b7280}.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:#eef2ff;color:#2563eb;font-size:12px}.chk{display:flex;gap:9px;align-items:flex-start;margin:10px 14px;font-size:14px}.box{width:18px;height:18px;border:2px solid #2563eb;border-radius:5px;flex:none}.box.on{background:#2563eb}.grey .box{border-color:#9ca3af}</style></head><body><div class="wrap">
<div class="hd">设置</div>

<div class="btn btn2">移除控制台（二次确认）</div>
<div class="nav"><div>总览</div><div>规则</div><div>会话</div><div>轮次</div><div>待办</div><div>管理</div></div>
</div></body></html>
