<!doctype html><html><head><title>sessions-list</title><meta charset="utf-8"><style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#eef0f3;color:#1d2129}.wrap{width:390px;margin:0 auto;background:#fff;min-height:640px;padding-bottom:14px}.hd{padding:16px;font-size:19px;font-weight:700}.lbl{margin:16px 14px 6px;font-size:13px;color:#2563eb;font-weight:600}.card{margin:8px 14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}.card .t{font-weight:600}.card .s{font-size:12.5px;color:#6b7280;margin-top:2px}.row{position:relative;margin:8px 14px;border-radius:12px;overflow:hidden}.row .under{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:center;background:#dc2626;color:#fff;padding-right:16px;font-weight:600}.row .over{position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;transform:translateX(-84px)}.btn{display:inline-block;margin:6px 14px 0;padding:10px 14px;background:#2563eb;color:#fff;border-radius:10px;font-size:13.5px;font-weight:600}.btn2{background:#fff;color:#2563eb;border:1.5px solid #2563eb}.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:12px}.chip2{background:#eff6ff;color:#2563eb}.bubble{margin:8px 14px;padding:10px 13px;background:#f3f4f6;border-radius:12px;max-width:78%}.bubble.me{background:#2563eb;color:#fff;margin-left:auto}.toolbar{display:flex;gap:8px;align-items:flex-end;margin:8px 14px;padding:9px;border:1px solid #e5e7eb;border-radius:14px}.toolbar .ic{width:34px;height:34px;border-radius:10px;background:#f3f4f6;text-align:center;line-height:34px;flex:none}.toolbar .inp{flex:1;min-height:34px}.toolbar .snd{background:#2563eb;color:#fff;border-radius:10px;padding:7px 13px;flex:none}.dim{color:#9ca3af}.err{margin:8px 14px;padding:10px 13px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;font-size:13px}.arrow{float:right;color:#6b7280}</style></head><body>
<div class="wrap"><div class="hd">会话</div>
<div class="lbl">状态 normal：列表</div>
<div class="card"><div class="t">NoMoTo 修复讨论 <span class="chip">设计会话</span></div><div class="s">等待你确认计划 · 2 分钟前</div></div>
<div class="card"><div class="t">APK 构建 <span class="chip2">普通</span></div><div class="s">已完成 · 11:20</div></div>
<div class="lbl">状态 empty：明确空态</div>
<div class="card dim"><div class="t">暂无会话</div><div class="s">新建一个会话开始调度</div></div>
<div class="lbl">状态 swipe-revealed：左滑露出「关闭」</div>
<div class="row"><div class="under">关闭</div><div class="over"><div class="t">APK 构建</div><div class="s">滑动中不触发点按</div></div></div>
<div class="lbl">状态 design-pending：设计会话卡片双按钮</div>
<div class="card"><div class="t">NoMoTo 修复讨论 <span class="chip">设计会话</span></div><div class="s">计划待放行</div><span class="btn">确认计划·放行落盘</span><span class="btn btn2">确认执行范围 →</span></div>
<div class="lbl">状态 close-confirm：二次确认</div>
<div class="card"><div class="t">关闭会话？</div><div class="s">关闭后可在网页控制台重新打开</div><span class="btn">确认关闭</span><span class="btn btn2">取消</span></div>
</div></body></html>
