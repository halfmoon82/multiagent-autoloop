<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选择控制台 · 参考稿（fix12：自定义名称）</title>
<style>body{font-family:-apple-system,sans-serif;margin:0;background:#0f1115;color:#e8eaf0}
header{padding:14px 16px;font-size:17px;font-weight:600;border-bottom:1px solid #23262e}
.row{padding:13px 16px;border-bottom:1px solid #1b1e25}
.title{font-size:15px;font-weight:600}.sub{font-size:12px;color:#8b91a0;margin-top:2px}
.add{padding:14px 16px;color:#6ea8fe;font-size:14px}
input{width:100%;box-sizing:border-box;background:#171a21;border:1px solid #2a2e39;border-radius:8px;color:#e8eaf0;padding:10px;margin-top:8px;font-size:14px}</style></head>
<body><header>选择控制台</header>
<div class="row"><div class="title">家里的 Mac mini</div><div class="sub">192.168.1.8:50761</div></div>
<div class="row"><div class="title">公司控制台</div><div class="sub">console.example.com</div></div>
<div class="row"><div class="title">192.168.31.20:50761</div><div class="sub">未命名（按地址显示）</div></div>
<div class="add">＋ 添加控制台
<input placeholder="自定义名称（可选，缺省显示地址）">
<input placeholder="控制台地址，如 192.168.1.8:50761"></div>
</body></html>
