<!doctype html><html><head><title>card-actions</title><meta charset="utf-8"><style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#eef0f3;color:#1d2129}.wrap{width:402px;margin:0 auto;background:#fff;min-height:520px;padding-bottom:14px}.hd{padding:16px;font-size:19px;font-weight:700}.lbl{margin:16px 14px 6px;font-size:13px;color:#16835c;font-weight:600}.card{margin:8px 14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}.card .t{font-weight:600}.card .s{font-size:12.5px;color:#6b7280;margin-top:2px}.btn{display:inline-block;margin:6px 8px 0 0;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600}.btn.pri{background:#16835c;color:#fff}.btn.sec{background:#fff;color:#16835c;border:1.5px solid #16835c}.btn.warn{background:#fff;color:#b45309;border:1.5px solid #f59e0b}.toast{margin:10px 14px;padding:10px 13px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:10px;font-size:13px;font-weight:600}</style></head><body>
<div class="wrap"><div class="hd">待我处理 · 决策卡操作</div>
<div class="lbl">每张决策卡内置三操作（与网页版一致）</div>
<div class="card"><div class="t">确认派发第三轮修复？</div><div class="s">四个问题的根因都已查明……</div>
<span class="btn pri">确认，创建并派发</span><span class="btn sec">先不派</span>
<div style="margin-top:8px">
<span class="btn sec">已处理</span><span class="btn sec">结案</span><span class="btn warn">退回调度</span></div></div>
<div class="lbl">交互：点「已处理」标记已办即消失；「结案」同；「退回调度」把卡退回给调度并等待代理结论</div>
<div class="toast">已退回调度，等待代理结论</div>
</div></body></html>
