<!doctype html><html><head><title>app-refresh</title><meta charset="utf-8"><style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#eef0f3;color:#1d2129}.wrap{width:402px;margin:0 auto;background:#fff;min-height:520px;padding-bottom:14px}.hd{padding:16px;font-size:19px;font-weight:700}.lbl{margin:16px 14px 6px;font-size:13px;color:#16835c;font-weight:600}.card{margin:8px 14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}.card .t{font-weight:600}.card .s{font-size:12.5px;color:#6b7280;margin-top:2px}.spin{margin:6px 14px;font-size:13px;color:#16835c}.toast{margin:10px 14px;padding:10px 13px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:10px;font-size:13px;font-weight:600}.dim{color:#9ca3af}</style></head><body>
<div class="wrap"><div class="hd">任意 tab 顶部下拉</div>
<div class="lbl">交互 pull-refresh：下拉出现刷新指示，松手重载当前 tab 数据</div>
<div class="spin">↻ 正在刷新总览…</div>
<div class="card"><div class="t">项目 DAG 进度</div><div class="s">数据已更新</div></div>
<div class="lbl">交互 version-reload：控制台界面版本变化时自动整页重载拿新界面（回到原 tab）</div>
<div class="toast">控制台界面已更新，自动为你切换到新版…</div>
<div class="card dim"><div class="s">不丢当前位置：重载后仍停在原来 tab 与会话</div></div>
</div></body></html>
