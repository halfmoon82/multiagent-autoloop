<!doctype html><html><head><title>decision-cards</title><meta charset="utf-8"><style>body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#eef0f3;color:#1d2129}.wrap{width:402px;margin:0 auto;background:#fff;min-height:560px;padding-bottom:14px}.hd{padding:16px;font-size:19px;font-weight:700}.lbl{margin:16px 14px 6px;font-size:13px;color:#16835c;font-weight:600}.card{margin:8px 14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}.card .t{font-weight:600}.card .s{font-size:12.5px;color:#6b7280;margin-top:2px}.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:#eff6ff;color:#2563eb;font-size:12px}.btn{display:inline-block;margin:6px 8px 0 0;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600}.btn.pri{background:#16835c;color:#fff}.btn.sec{background:#fff;color:#16835c;border:1.5px solid #16835c}.toast{margin:10px 14px;padding:10px 13px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:10px;font-size:13px;font-weight:600}</style></head><body>
<div class="wrap"><div class="hd">会话 · 待我处理</div>
<div class="lbl">状态 open：卡片带「所属会话」标注，只出现在自己的会话里</div>
<div class="card"><span class="chip">所属会话：健康链路</span><div class="t">确认派发第三轮修复？</div>
<div class="s">四个问题的根因都已查明……</div>
<span class="btn pri">确认，创建并派发</span><span class="btn sec">先不派</span></div>
<div class="lbl">交互验收：点「结案」或任选项后卡片立即消失，列表与角标同步</div>
<div class="toast">已回答，卡片已收起</div>
<div class="card dim" style="opacity:.55"><div class="s">（已回答的卡不再残留；切到别的会话也看不到这张卡）</div></div>
</div></body></html>
