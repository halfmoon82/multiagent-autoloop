<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d2e">
  <!-- 打包时由 build-apk.mjs 注入远程 /mobile/ 地址；本页不含任何凭证或业务数据。 -->
  <meta name="autoloop-console-mobile-url" content="">
  <title>网络不可用</title>
  <style>
    :root { color-scheme: light; --ink: #0f3d2e; --line: #d7e5de; --bg: #f4f8f6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif; line-height: 1.5; }
    main { max-width: 32rem; margin: 0 auto; padding: calc(3rem + env(safe-area-inset-top)) 1.2rem; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 0.9rem; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.7rem; }
    p { margin: 0 0 1rem; color: #2f6b53; }
    button { min-height: 48px; padding: 0.7rem 1rem; font: inherit; font-size: 1rem; color: #fff; background: var(--ink); border: 0; border-radius: 0.6rem; cursor: pointer; }
    #retry-status { min-height: 1.4em; margin: 0.9rem 0 0; font-size: 0.9rem; color: #a3312a; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>网络不可用</h1>
      <p>当前无法连接控制台。请检查 HTTPS 网络或移动数据后重试。</p>
      <button id="retry" type="button">重试连接</button>
      <p id="retry-status" role="status"></p>
    </div>
  </main>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="autoloop-console-mobile-url"]');
      var remote = (meta && meta.getAttribute('content') || '').trim();
      var status = document.getElementById('retry-status');
      var busy = false;
      // 错误页源是本地 https://localhost，就地刷新只会回到离线页；
      // 必须先探测远程地址可达，再把 location.href 设为远程 /mobile/ 入口。
      async function retry() {
        if (busy) return;
        if (navigator.onLine === false) { status.textContent = '设备当前离线，请开启网络后重试'; return; }
        if (!remote || !/^https:\/\//.test(remote)) { status.textContent = '未配置控制台地址，请在 App 内重新打开'; return; }
        busy = true;
        status.textContent = '正在检查连接…';
        try {
          var response = await fetch(remote, { method: 'GET', cache: 'no-store' });
          if (!response.ok) throw new Error('unreachable');
          window.location.href = remote;
        } catch (error) {
          status.textContent = '仍无法连接控制台，请检查网络后重试';
          busy = false;
        }
      }
      document.getElementById('retry').addEventListener('click', retry);
    })();
  </script>
</body>
</html>
